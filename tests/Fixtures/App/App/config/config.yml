framework:
    secret: testSecret
    test: true
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    validation:
        email_validation_mode: html5

doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                driver:   pdo_sqlite
                memory:   true

nicoren_cron:
    db_driver: mongodb # other valid values are 'mongodb' and 'orm'
    job_class: Nicoren\CronBundle\Model\Job
    timezone: UTC

doctrine_mongodb:
    connections:
        default:
            server: 'mongodb://localhost:27017'
            options: {}
    default_database: 'TEST'
    document_managers:
        default:
            auto_mapping: true
