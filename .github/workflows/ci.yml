name: CI

on:
    push:
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.5']
        services:
            mongodb:
                image: mongo:8.0
                ports:
                    - 27017:27017
        env:
            MONGODB_URL: mongodb://localhost:27017
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mongodb, redis, pdo_sqlite, posix
                  coverage: none
                  tools: composer
            - run: composer install --no-progress --no-interaction
            - run: composer lint
            - run: composer cs
              if: matrix.php == '8.5'
            - run: composer phpstan
              if: matrix.php == '8.5'
            - run: composer test
